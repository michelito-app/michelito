name: Deploy demo

# After a successful CI run for a push to main: image to GHCR (sha and latest tags) and deploy
# to the VPS over SSH. One image serves both the demo and, when the server's .env turns on the
# "hosted" profile, the hosted app (michelito.app): deploy.sh backs up and health-checks both. The deploy key can only run deploy.sh (forced command): it sends
# "<sha> <digest>" as the command (the server runs `image@digest`, exactly what was built) and
# the job's GITHUB_TOKEN on stdin to pull the image. If another commit reached main while CI was
# running, nothing is deployed: that commit's CI will do it.
# By hand (Actions → "Deploy demo" → Run workflow) it can only roll back.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [rollback]
        default: rollback

permissions:
  contents: read

concurrency:
  group: demo-deploy
  cancel-in-progress: false

env:
  MICHELITO_HOST: ${{ vars.MICHELITO_HOST || 'demo.michelito.app' }}
  # Set the repository variable MICHELITO_APP_HOST (michelito.app) once the hosted app runs.
  MICHELITO_APP_HOST: ${{ vars.MICHELITO_APP_HOST || '' }}

jobs:
  image:
    name: Image on GHCR
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      current: ${{ steps.current.outputs.current }}
      sha: ${{ steps.meta.outputs.sha }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Image metadata
        id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "invalid sha"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"
      - name: Is it still the tip of main?
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.meta.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [[ $tip == "$SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo "\`$SHA\` is no longer the tip of \`main\` (now \`$tip\`): the new commit's CI deploys it."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::$SHA is no longer the tip of main; not deploying."
          fi
      - if: steps.current.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.sha }}
          persist-credentials: false
      - if: steps.current.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.current.outputs.current == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.current.outputs.current == 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the VPS
    needs: image
    if: needs.image.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: demo
      url: https://${{ vars.MICHELITO_HOST || 'demo.michelito.app' }}
    permissions:
      contents: read
      packages: read # the token sent to the server can only pull the image
    steps:
      - name: Key and known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: deploy.sh on the server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SHA: ${{ needs.image.outputs.sha }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ && $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "invalid sha or digest"; exit 1; }
          printf '%s\n' "$GITHUB_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" "$SHA $DIGEST"
      # Only a warning: if it fails, the server already answered from inside and does not roll
      # back on its own (see docs/deployment.md, "Rolling back").
      - name: Check from outside
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors --max-time 10 \
            "https://$MICHELITO_HOST/api/health"
      - name: Check the hosted app from outside
        if: env.MICHELITO_APP_HOST != ''
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors --max-time 10 \
            "https://$MICHELITO_APP_HOST/api/health"
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  rollback:
    name: Go back to the previous image
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: demo
      url: https://${{ vars.MICHELITO_HOST || 'demo.michelito.app' }}
    permissions:
      contents: read
      packages: read # in case the previous image is no longer on the server
    steps:
      - name: Key and known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: deploy.sh rollback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          printf '%s\n' "$GITHUB_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" rollback
      - name: Check from outside
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors --max-time 10 \
            "https://$MICHELITO_HOST/api/health"
      - name: Check the hosted app from outside
        if: env.MICHELITO_APP_HOST != ''
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors --max-time 10 \
            "https://$MICHELITO_APP_HOST/api/health"
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
