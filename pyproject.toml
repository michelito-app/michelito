[project]
name = "michelito"
version = "0.1.0"
description = "Fetches bank statements from Gmail, validates them and stores them in SQLite"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "pdfplumber>=0.11",
    "cryptography>=42",
    "keyring>=25",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "fastapi>=0.162.7",
    "uvicorn>=0.54.0",
    "sqlcipher3>=0.6.5",
]

[project.scripts]
michelito = "michelito.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["michelito"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
